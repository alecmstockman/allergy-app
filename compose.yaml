services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: allergy_app
      POSTGRES_USER: allergy_app
      POSTGRES_PASSWORD: local_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allergy_app -d allergy_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: